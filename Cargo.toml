[workspace]
members = [
    "crates/gl-node",
    "crates/ledger",
    "crates/p2p",
    "crates/security",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
axum = "0.8"
async-graphql = "7"
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
sha2 = "0.10"
iroh = "1"
iroh-gossip = "0.101"
bytes = "1"
ciborium = "0.2"
anyhow = "1"
tower-http = { version = "0.6", features = ["cors"] }
# Best-effort wiping of secret-key intermediates (L-04). Already in the tree as
# a transitive dependency of ed25519-dalek / iroh; declared here so gl-node can
# use `Zeroizing` on the hex string and byte buffers it parses the node key from.
zeroize = "1"

[workspace.lints.clippy]
all = { level = "deny" }

# Defense-in-depth (T17): keep integer overflow checks on in release builds
# (the Docker image builds --release), so a silent wrap becomes a loud panic.
# The untrusted-input arithmetic paths already use checked/saturating ops
# (T1 weights, T2 Lamport clock), so this should not fire in normal operation —
# if it ever does, it has caught a real bug rather than corrupting state.
[profile.release]
overflow-checks = true
