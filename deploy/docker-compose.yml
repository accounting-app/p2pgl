# Multi-node OpenLedger deployment (§5 layout).
#
# Spins up 3 gl-node instances. Inbound ledger replication only happens
# after you put each node's EndpointId into p2p.bootstrapEndpointIds
# (empty allowlist = no remote Supply). Use a unique swarmTopic per mesh;
# this sample uses openledger/docker-dev (not the public default), and pins
# meshId to that same string — see "Mesh identity" below.
#
# Usage — every node needs its OWN key, so generate three:
#   GL_NODE_0_API_KEY="$(openssl rand -hex 32)" \
#   GL_NODE_1_API_KEY="$(openssl rand -hex 32)" \
#   GL_NODE_2_API_KEY="$(openssl rand -hex 32)" \
#     docker compose -f deploy/docker-compose.yml up --build
#
# Or, to keep the keys out of your shell history: copy deploy/.env.example to
# deploy/.env, fill in the three values there, and run the plain
# `docker compose -f deploy/docker-compose.yml up --build`. Compose reads a
# `.env` beside the compose file automatically. `deploy/.env` is gitignored;
# `deploy/.env.example` is the committed template and holds no secret.
#
# Each node exposes, ON THE HOST LOOPBACK INTERFACE ONLY:
#   - node-0: http://127.0.0.1:4000/graphql  (POST; set X-Api-Key)
#   - node-1: http://127.0.0.1:4001/graphql
#   - node-2: http://127.0.0.1:4002/graphql
#   - All nodes: GET /health for health checks
#
# ── Why the ports are published as "127.0.0.1:PORT:4000" (L-03) ───────────────
# `"4000:4000"` publishes on 0.0.0.0, i.e. every host interface. This stack
# declares tls.mode "terminated" in gl-node.docker.json but contains no
# terminator, so all-interfaces publishing served the writable GraphQL API as
# plaintext HTTP to anything that could route to the host — the API key would
# cross the wire in the clear on every request. Binding the published side to
# loopback keeps the stack reachable for local development and unreachable from
# off-host. When you add a real TLS terminator, put it in this compose file (or
# on the host), point it at these loopback ports, and only the terminator gets a
# public listener.
#
# ── API keys (L-08) ──────────────────────────────────────────────────────────
# Each node gets a distinct GL_NODE_API_KEY. One shared key means compromising
# any single node hands the attacker write access to all of them, and rotating
# it is an all-or-nothing outage. The `:-` defaults below are deliberately
# unusable placeholders: they are shorter than the 16-byte minimum gl-node
# enforces on auth.apiKey, so a stack started without the three variables set
# FAILS TO BOOT with a config-validation error naming the key, rather than
# coming up with a guessable credential. Set real per-node values of at least
# 16 bytes (`openssl rand -hex 32` gives 64). Published sample/placeholder
# strings are refused outright by the denylist, so do not reuse anything that
# appears in this repository or the README.
#
# ── Reverse proxy / trustedProxies (M-04) ────────────────────────────────────
# gl-node.docker.json deliberately ships with no `trustedProxies`, so it logs
# the M-04 boot warning ("trustedProxies is empty on a node that sits behind a
# reverse proxy …"). Once a terminator is added, list its address there too:
# otherwise every client behind it shares one rate-limit bucket (M-04) AND one
# per-IP connection share (`http.maxConnectionsPerIp`, M-33). That is correct for this stack as shipped: there is no
# terminator, nothing sends X-Forwarded-For, and trusting a header nobody sets
# would be strictly worse. The moment you add a terminator in front of these
# loopback ports, add its address to gl-node.docker.json so the per-IP rate
# limiter keys on the real client instead of putting the whole internet in one
# bucket:
#
#   "trustedProxies": ["172.18.0.9"]
#
# Entries are exact IP literals of the proxies themselves — not CIDR ranges,
# not hostnames, not ports — and only `X-Forwarded-For` is honoured (RFC 7239
# `Forwarded:` is not supported). Listing anything an untrusted client can
# reach lets that client forge its own rate-limit identity.
#
# ── Mesh identity (L-23, R-9) ────────────────────────────────────────────────
# All three nodes share gl-node.docker.json, so they share a signature domain —
# which is what a single mesh needs. `meshId` is set there to
# "openledger/docker-dev", which is the stack's swarmTopic BYTE FOR BYTE. That
# is deliberate: before this change the domain fell back to the topic, and a
# signature is verified by rebuilding the signed message with the verifier's own
# domain, so the topic's exact value is the only meshId that keeps every
# directive this stack has already signed verifying. Any other value — a fresh
# UUID included — would orphan that history. (A node with meshId unset now logs
# a boot WARN saying exactly this; meshId becomes required in a later release.)
#
# For a NEW mesh of your own, do not copy this value: generate a meshId
# (`uuidgen`) and a unique swarmTopic before the first directive is written. For
# an EXISTING mesh, set meshId to your current swarmTopic verbatim — see the
# README's `p2p.meshId` section.
#
# GraphiQL is off. p2p.relayMode is "disabled": a node reaches only the peers
# its p2p.peerAddresses lists, and gl-node.docker.json lists none, so as shipped
# the three nodes run side by side but do not replicate. To make them replicate
# on this bridge, give each node's config its peers' EndpointIds (logged at
# boot) in bootstrapEndpointIds, a fixed p2p.listenPort, and their addresses in
# peerAddresses — e.g. "node-1:<its listenPort>" — or set "n0" to use n0's public
# discovery and relays.
# (docs/build-log/001-peer-discovery adds a relay service to this stack.)
#
# Each node gets its OWN volume and therefore its own .bean file. Pointing two
# containers at one ledger volume now fails closed at startup on the
# `<ledger>.lock` sidecar (M-17) — that is the exclusivity check working, not a
# bug.

services:
  node-0:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gl-node-0
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - node0-data:/data
      - ./gl-node.docker.json:/data/gl-node.config.json:ro
    environment:
      - RUST_LOG=info
      - GL_NODE_CONFIG=/data/gl-node.config.json
      - GL_NODE_API_KEY=${GL_NODE_0_API_KEY:-change-me-0}
    networks:
      - openledger
    healthcheck:
      test: ["CMD", "/usr/local/bin/gl-node", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  node-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gl-node-1
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - node1-data:/data
      - ./gl-node.docker.json:/data/gl-node.config.json:ro
    environment:
      - RUST_LOG=info
      - GL_NODE_CONFIG=/data/gl-node.config.json
      - GL_NODE_API_KEY=${GL_NODE_1_API_KEY:-change-me-1}
    networks:
      - openledger
    healthcheck:
      test: ["CMD", "/usr/local/bin/gl-node", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      node-0:
        condition: service_healthy

  node-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gl-node-2
    ports:
      - "127.0.0.1:4002:4000"
    volumes:
      - node2-data:/data
      - ./gl-node.docker.json:/data/gl-node.config.json:ro
    environment:
      - RUST_LOG=info
      - GL_NODE_CONFIG=/data/gl-node.config.json
      - GL_NODE_API_KEY=${GL_NODE_2_API_KEY:-change-me-2}
    networks:
      - openledger
    healthcheck:
      test: ["CMD", "/usr/local/bin/gl-node", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      node-0:
        condition: service_healthy

volumes:
  node0-data:
  node1-data:
  node2-data:

networks:
  openledger:
    driver: bridge
