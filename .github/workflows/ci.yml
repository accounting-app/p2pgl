name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (M-7). The trailing comment
# records the human-readable version; update both together when bumping.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config as an
          # `extraheader` credential. It is there for the rest of the job
          # otherwise, so anything the job runs — a build script, a proc macro,
          # a dependency's `build.rs` — can read it and push with it. Nothing
          # here does any git operation after checkout, so the credential has no
          # use and only a blast radius.
          persist-credentials: false
      # Pinned by SHA, so the toolchain can no longer be inferred from the ref;
      # `toolchain: stable` keeps installing current stable at run time while the
      # action code stays frozen at this commit (stable branch tip at pin time).
      # T89 (0925 §5): re-pinned — `stable` is force-moved, and the previous pin
      # (4360b52) was left unreachable from every ref, one GC away from failing CI.
      # T96 (L-123): pinned on `master` instead. `stable` and the other generated
      # branches are regenerated together, which orphans their old tips (6bed076,
      # T89's pin, was reachable from `stable` alone); `master` is not rewritten.
      # `master`'s action requires the `toolchain` input, which is given below.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      # `--locked` here, not only on Test: clippy runs the resolver, so without
      # it a Cargo.toml change with a stale Cargo.lock is silently resolved and
      # the lockfile rewritten — after which the Test step's own `--locked`
      # trivially passes and proves nothing. Both steps need it or neither
      # catches an unreviewed dependency bump (L-46).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # `cargo audit` against the RustSec advisory DB, over the committed
      # `Cargo.lock` — this is the watch that covers the `lru`/`h2` advisories
      # the 09/02 report asked to keep an eye on. The token is for posting
      # findings; `contents: read` above is the only repository permission the
      # workflow grants.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
