[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# T67 / R-17: `O_NOFOLLOW`, `O_NONBLOCK`, `ELOOP`/`ENXIO` and `geteuid` for the
# checked opens in `journal.rs`. Pinned to the version already in Cargo.lock —
# it was compiled in transitively (tokio → mio), so this adds no new crate.
libc = "0.2.189"

[lints]
workspace = true

[dev-dependencies]
rust_decimal_macros = "1"
proptest = "1"
# Test-only: capture the `warn!`s that T35 (L-17, L-12) added, so "the operator
# is told what was skipped" is asserted rather than assumed.
tracing-subscriber = { workspace = true }
