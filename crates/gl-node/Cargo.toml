[package]
name = "gl-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "gl-node"
path = "src/main.rs"

[dependencies]
ledger = { path = "../ledger" }
p2p = { path = "../p2p" }
security = { path = "../security" }

tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = "7"
chrono = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
rust_decimal = { workspace = true }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = [
    "server",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
hex = "0.4"
subtle = "2"
sha2 = { workspace = true }
zeroize = { workspace = true }


[dev-dependencies]
# An in-process iroh-relay server for the own-relay tests, on 127.0.0.1
# (docs/build-log/001-peer-discovery). Test builds only: resolver 2 keeps
# dev-dependency features out of the shipped binary.
iroh = { workspace = true, features = ["test-utils"] }
# Its access-control trait, for the relay allowlist test; already in the
# lockfile through iroh's test-utils. Pinned to the iroh-relay that iroh uses:
# bump the two together (a mismatch fails to compile).
iroh-relay = { version = "=1.0.3", features = ["server"] }
http-body-util = "0.1"
tempfile = "3"
rust_decimal_macros = "1"
chrono = { workspace = true }

[lints]
workspace = true
